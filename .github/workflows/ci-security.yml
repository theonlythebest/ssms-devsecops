
name: ci-security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install lint deps
        run: pip install --upgrade pip flake8

      - name: flake8
        run: flake8 backend/app --max-line-length=140 --ignore=E501,W503,E203,E402,F401,F841,W291,W293,E731 --exit-zero --statistics
        continue-on-error: true

  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit (+ SARIF formatter)
        run: pip install --upgrade pip "bandit[sarif]==1.7.10"

      - name: Run Bandit (JSON for humans)
        run: bandit -r backend/app -s B311 -f json -o bandit.json
        continue-on-error: true

      - name: Run Bandit (SARIF for GitHub)
        run: bandit -r backend/app -s B311 -f sarif -o bandit.sarif
        continue-on-error: true

      - name: Upload Bandit SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Upload Bandit JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit.json

      - name: Fail on Bandit HIGH severity
        run: |
          set -e
          high=$(python -c "import json; d=json.load(open('bandit.json')); print(sum(1 for r in d.get('results',[]) if r.get('issue_severity','').upper()=='HIGH'))")
          echo "Bandit HIGH-severity findings: $high"
          if [ "$high" != "0" ]; then
            echo "::error::Bandit reported $high HIGH-severity findings -- failing the build."
            exit 1
          fi

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan (SARIF)
        run: |
          semgrep ci \
            --config p/ci \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/python \
            --config p/dockerfile \
            --sarif --output=semgrep.sarif || true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Semgrep artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif

  pip-audit:
    name: pip-audit (deps CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install --upgrade pip pip-audit

      - name: pip-audit
        run: |
          pip-audit -r backend/requirements.txt \
            --strict \
            --format json \
            --output pip-audit.json \
            || echo "pip-audit_exit=$?" >> "$GITHUB_ENV"

      - name: Upload pip-audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json

      - name: Warn on dependency CVEs
        if: env.pip-audit_exit != ''
        run: |
          echo "::warning::pip-audit detected vulnerable dependencies. See artifact pip-audit-report."

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
